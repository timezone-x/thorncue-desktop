name: LAME probe (temporary)

# Temporary: checks that mp3lame-encoder (LAME, built from C) compiles and encodes on all three
# release targets before the MP3 export is built on it (thorncue-spec#17). Removed again before
# the export PR is merged.
on:
  push:
    branches: [claude/bold-turing-k4z45j-export]
    paths: [.github/workflows/lame-probe.yml]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: lameprobe
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Write the probe
        working-directory: .
        run: |
          mkdir -p lameprobe/src
          cat > lameprobe/Cargo.toml <<'TOML'
          [package]
          name = "lameprobe"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          mp3lame-encoder = "0.3.0"
          symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
          TOML
          cat > lameprobe/src/main.rs <<'RUST'
          use mp3lame_encoder::{Bitrate, Builder, FlushGap, InterleavedPcm, MonoPcm, Mode, Quality};

          fn encode(rate: u32, ch: u8, frames: usize, kbps: Bitrate) -> Vec<u8> {
              let mut b = Builder::new().unwrap();
              b.set_sample_rate(rate).unwrap();
              b.set_num_channels(ch).unwrap();
              b.set_brate(kbps).unwrap();
              b.set_mode(if ch == 1 { Mode::Mono } else { Mode::JointStereo }).unwrap();
              b.set_quality(Quality::Best).unwrap();
              b.set_to_write_vbr_tag(true).unwrap();
              let mut e = b.build().unwrap();
              let mut pcm = Vec::with_capacity(frames * ch as usize);
              for i in 0..frames {
                  let v = (i as f32 * 440.0 * std::f32::consts::TAU / rate as f32).sin() * 0.5;
                  for _ in 0..ch { pcm.push(v); }
              }
              let mut out = Vec::new();
              out.reserve(mp3lame_encoder::max_required_buffer_size(frames));
              if ch == 1 { e.encode_to_vec(MonoPcm(&pcm[..]), &mut out).unwrap(); }
              else { e.encode_to_vec(InterleavedPcm(&pcm[..]), &mut out).unwrap(); }
              out.reserve(7200);
              e.flush_to_vec::<FlushGap>(&mut out).unwrap();
              let mut tag = Vec::with_capacity(e.lame_tag_size());
              let n = e.lame_tag_encode_to_vec(&mut tag).expect("tag").get();
              out[..n].copy_from_slice(&tag[..n]);
              out
          }

          fn decoded_len(bytes: Vec<u8>) -> u64 {
              use symphonia::core::{codecs::audio::AudioDecoderOptions, formats::{FormatOptions, TrackType}, io::MediaSourceStream, meta::MetadataOptions, formats::probe::Hint};
              let mss = MediaSourceStream::new(Box::new(std::io::Cursor::new(bytes)), Default::default());
              let mut f = symphonia::default::get_probe().probe(&Hint::new(), mss, FormatOptions::default(), MetadataOptions::default()).unwrap();
              let t = f.default_track(TrackType::Audio).unwrap();
              let id = t.id;
              let mut d = symphonia::default::get_codecs().make_audio_decoder(t.codec_params.as_ref().unwrap().audio().unwrap(), &AudioDecoderOptions::default()).unwrap();
              let mut n = 0u64;
              while let Ok(Some(p)) = f.next_packet() { if p.track_id != id { continue } n += d.decode(&p).unwrap().frames() as u64; }
              n
          }

          fn main() {
              println!("lame {}", mp3lame_encoder::mp3lame_version());
              for (rate, ch, kbps, frame) in [(44100u32, 2u8, Bitrate::Kbps320, 1152i64), (48000, 1, Bitrate::Kbps320, 1152), (22050, 2, Bitrate::Kbps160, 576), (8000, 1, Bitrate::Kbps64, 576)] {
                  let frames = (rate as f64 * 2.15).round() as usize;
                  let mp3 = encode(rate, ch, frames, kbps);
                  let got = decoded_len(mp3.clone()) as i64;
                  let ok = (got - frames as i64).abs() <= frame;
                  println!("{rate} Hz {ch}ch: {} bytes, want {frames} frames, decoded {got} -> {}", mp3.len(), if ok {"OK"} else {"WRONG"});
                  assert!(ok, "decoded length is more than one MP3 frame off");
              }
          }
          RUST
      - name: Build and run (native)
        run: cargo run --release
      - name: Build for Intel macs too (universal build)
        if: runner.os == 'macOS'
        run: cargo build --release --target x86_64-apple-darwin
