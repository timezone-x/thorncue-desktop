[workspace]
resolver = "3"
members = ["crates/tqs", "crates/engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/timezone-x/thorncue-desktop"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tempfile = "3.27.0"

# Audio decoding is slow in debug builds; keep the audio crates optimised even in dev.
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.kira]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
