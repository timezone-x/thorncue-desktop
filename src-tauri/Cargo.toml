[package]
name = "thorncue"
description = "ThornCue: theatre sound-cue playback"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "thorncue"

[lib]
# The _lib suffix keeps the lib name distinct from the bin name (cargo issue 8519, Windows).
name = "thorncue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
tempfile.workspace = true
