[package]
name = "thorncue"
description = "ThornCue: theatre sound-cue playback"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "thorncue"

[lib]
# The _lib suffix keeps the lib name distinct from the bin name (cargo issue 8519, Windows).
name = "thorncue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
tempfile.workspace = true
thiserror.workspace = true
tqs = { path = "../crates/tqs" }
engine = { path = "../crates/engine" }
crossbeam-channel = "0.5.17"
uuid = { version = "1.29.2", features = ["v4"] }
trash = "5.3.0"
sha2 = "0.11.1"
# rustls (no OpenSSL); blocking client, used from blocking tasks.
reqwest = { version = "0.13.5", features = ["blocking"] }
keyring = "4.2.0"
# Keeps the screen and machine awake while a show is open (M8).
keepawake = "0.6.1"

[dev-dependencies]
tiny_http = "0.12.0"
