[package]
name = "tqs"
description = "ThornCue show package (.tqs) reader, writer and legacy web import"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
sha2 = "0.11.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The same symphonia kira 0.12 uses, with the same formats, so there is one copy in the app.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "aac", "isomp4", "aiff"] }

[dev-dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
